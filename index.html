<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول – مصمم الإعلانات</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at 20% 10%, #ffffff 0, #e8f3f2 40%, #cfe3e2 100%); }
    .login { width: min(420px, 100%); background: #fff; border-radius: 22px; box-shadow: 0 20px 60px rgba(15,74,77,.18); overflow: hidden; }
    .login .head { text-align: center; padding: 28px 24px 18px; background: linear-gradient(180deg, #f3f9f8, #fff); }
    .login .head svg { width: 92px; height: 92px; }
    .uni-ar { font-family: 'Aref Ruqaa', serif; font-size: 38px; color: #0f4a4d; line-height: 1.1; }
    .uni-en { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; color: #0f4a4d; }
    .login h1 { font-size: 17px; color: #2b7574; margin: 14px 0 0; font-weight: 600; }
    .login form { padding: 8px 26px 26px; }
    .pass { position: relative; }
    .pass button { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; color: #5f7574; }
    .err { color: #b3261e; min-height: 20px; font-size: 13px; margin: 4px 0 8px; }
    .login .btn.primary { width: 100%; justify-content: center; padding: 11px; font-size: 15px; }
    .foot { text-align: center; font-size: 12px; color: #5f7574; padding: 0 20px 18px; }
  </style>
</head>
<body>
  <div class="login">
    <div class="head">
      <img src="assets/img/logo.png" alt="جامعة القصيم" style="height:96px;max-width:100%">
      <h1>مصمم إعلانات المناقشات العلمية</h1>
    </div>
    <form id="f" autocomplete="on">
      <div class="field"><label for="u">اسم المستخدم</label><input type="text" id="u" dir="ltr" autocomplete="username" required autofocus></div>
      <div class="field"><label for="p">كلمة المرور</label>
        <div class="pass"><input type="password" id="p" dir="ltr" autocomplete="current-password" required><button type="button" id="eye" title="إظهار">👁</button></div>
      </div>
      <label class="check"><input type="checkbox" id="remember"> تذكرني على هذا الجهاز</label>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit" id="go">دخول</button>
    </form>
    <div class="foot">الإعلام والاتصال المؤسسي</div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    if (QAuth.current()) location.replace('app.html');
    document.getElementById('eye').onclick = () => { const p = document.getElementById('p'); p.type = p.type === 'password' ? 'text' : 'password'; };
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById('err'), go = document.getElementById('go');
      err.textContent = ''; go.disabled = true;
      try {
        await QAuth.login(document.getElementById('u').value, document.getElementById('p').value, document.getElementById('remember').checked);
        location.replace('app.html');
      } catch (ex) { err.textContent = ex.message; go.disabled = false; }
    };
  </script>
</body>
</html>
